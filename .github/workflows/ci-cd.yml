# Pipeline do AlertaBairro
#   segredos (Gitleaks) ─┐
#   SAST (Semgrep) ──────┤
#   testes (pytest) ─────┼─> build + scan de imagem (Trivy) ─> push ACR ─> deploy na VM Azure (Run Command)
#   IaC (Terraform+Trivy)┘
# Qualquer achado HIGH/CRITICAL ou segredo vazado barra o pipeline antes do deploy.
# Todas as actions de terceiros estão fixadas por SHA de commit (tags podem ser reescritas,
# como no ataque à trivy-action em março/2026).
name: CI/CD

on:
  push: # a cada push, em qualquer branch (o deploy só acontece na main)
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: 1.185.0
  TRIVY_VERSION: v0.69.3
  DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # ------------------------------------------------------------------ 1. segredos
  gitleaks:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (com verificação de checksum)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz

      - name: Procurar segredos nos commits novos
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # analisa só os commits que chegaram neste push/PR; branch nova ou execução manual = histórico todo
          if [ "$EVENTO" = "pull_request" ]; then
            FAIXA="$BASE..$HEAD"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            FAIXA="$ANTES..$GITHUB_SHA"
          else
            FAIXA=""
          fi
          echo "Faixa analisada: ${FAIXA:-histórico completo}"
          gitleaks git . --redact --verbose --exit-code 1 ${FAIXA:+--log-opts=$FAIXA}

  # ------------------------------------------------------------------ 2. SAST
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Instalar Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Analisar código (Python, JS, Dockerfile, Terraform, Actions)
        run: |
          semgrep scan --error --metrics=off \
            --config p/default --config p/dockerfile --config p/terraform --config p/github-actions

  # ------------------------------------------------------------------ 3. testes
  testes:
    name: Testes da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  # ------------------------------------------------------------------ 4. IaC
  iac:
    name: Terraform (fmt, validate, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: terraform fmt / validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Trivy config (má configuração na infraestrutura)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ------------------------------------------------------------------ 5. build + scan + push
  build:
    name: Imagem ${{ matrix.servico }}
    needs: [gitleaks, semgrep, testes, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: troca o token do GitHub por credencial temporária da Azure
    strategy:
      fail-fast: true
      matrix:
        include:
          - servico: api
            contexto: backend
          - servico: web
            contexto: frontend
    env:
      IMAGEM: alertabairro-${{ matrix.servico }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Build
        env:
          CONTEXTO: ${{ matrix.contexto }}
        run: docker build --pull -t "$IMAGEM" "$CONTEXTO"

      - name: Trivy image (vulnerabilidades no SO e nas bibliotecas)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGEM }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login na Azure (OIDC, sem senha)
        if: env.DEPLOY == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push para o ACR
        if: env.DEPLOY == 'true'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          REGISTRY="$ACR_NAME.azurecr.io"
          docker tag "$IMAGEM" "$REGISTRY/$IMAGEM"
          docker push "$REGISTRY/$IMAGEM"

  # ------------------------------------------------------------------ 6. deploy
  deploy:
    name: Deploy na VM (Azure)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login na Azure (OIDC, sem senha)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enviar compose e subir a nova versão (Run Command, sem SSH)
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          VM_NAME: ${{ vars.VM_NAME }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          KEY_VAULT: ${{ vars.KEY_VAULT }}
        run: |
          set -euo pipefail
          PACOTE=$(tar -C deploy -czf - . | base64 -w0)
          cat > script.sh <<SCRIPT
          set -eu
          timeout 900 sh -c 'until [ -f /var/lib/alertabairro-pronto ]; do sleep 5; done'
          mkdir -p /opt/alertabairro
          echo $PACOTE | base64 -d | tar -xzf - -C /opt/alertabairro
          ACR=$ACR_NAME.azurecr.io IMAGE_TAG=$GITHUB_SHA KEYVAULT=$KEY_VAULT bash /opt/alertabairro/deploy.sh
          SCRIPT

          SAIDA=$(az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" \
            --command-id RunShellScript --scripts @script.sh \
            --query "value[0].message" --output tsv)
          echo "$SAIDA"
          # o Run Command não devolve o código de saída do script: conferimos a marca final do deploy.sh
          echo "$SAIDA" | grep -q "DEPLOY_OK $GITHUB_SHA"

      - name: Teste de fumaça
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$APP_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "API não respondeu em $APP_URL" && exit 1
